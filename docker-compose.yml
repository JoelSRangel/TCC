services:
  neo4j-tcc:
    image: neo4j:5.12.0
    container_name: neo4j-tcc
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt (driver Python)
    environment:
      # ${NEO4J_PASSWORD} vem do arquivo .env na mesma pasta (docker compose
      # carrega .env automaticamente). Copie .env.example para .env antes de subir.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
